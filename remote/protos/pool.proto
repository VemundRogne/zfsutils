syntax = "proto3";

package remotezfs.v1;

service PoolInterface {
    rpc ListPools(ListPoolsRequest) returns (stream Pool) {}
    rpc getPoolProperty(PoolPropertyRequest) returns (PoolPropertyReply) {}
};

message ListPoolsRequest {}

message Pool {
    string name = 1;
    string hostname = 2;
}

message PoolPropertyReply {
    string value = 1;
}

message PoolPropertyRequest {
    Pool target = 1;
    string property = 2;
}
