syntax = "proto3";

service PoolInterface {
    rpc ListPools(ListPoolsRequest) returns (stream Pool) {}
    rpc getPoolProperty(PoolPropertyRequest) returns (PoolProperty) {}
};

message ListPoolsRequest { int32 nMax = 1; }

message Pool {
    string name = 1;
    string hostname = 2;
}

message PoolProperty {
    string name = 1;
    string value = 2;
}

message PoolPropertyRequest {
    Pool target = 1;
    string property = 2;
}
